<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Il mio cantiere</title>
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0}
.sub{color:var(--mut);font-size:13px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
nav{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
nav button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on,.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.grid .card{margin:0}
.k{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.v{font-size:22px;font-weight:650;margin-top:2px}
.bar{height:10px;background:var(--bar);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ac);border-radius:6px}
.bar.sp>i{background:var(--ok)}
.row{display:grid;grid-template-columns:1.4fr 1.6fr 1.6fr;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:500;padding:6px 4px}
td{padding:4px;border-top:1px solid var(--bd)}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:5px 7px;width:100%;min-width:0}
input[type=checkbox]{width:auto}
input[type=range]{padding:0}
.x{background:none;border:none;color:var(--bad);cursor:pointer;font-size:18px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);white-space:nowrap}
.t0{color:var(--mut)}.t1{color:var(--warn)}.t2{color:var(--ok)}
.neg{color:var(--bad)}
.hide{display:none}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;border:none;background:var(--ac);color:#fff;font-size:28px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3);z-index:20}
.sc{display:flex;gap:10px;font-size:13px;padding:2px 0;border-top:1px solid var(--bd)}
.sc span:first-child{width:48px;color:var(--mut)}.sc span:nth-child(2){flex:1}
.dash{display:grid;grid-template-columns:minmax(230px,1fr) 2.6fr;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin-bottom:14px}
.pg{padding:10px 14px;border-right:1px solid var(--bd)}
.pr{display:grid;grid-template-columns:44px 1fr 38px;gap:8px;align-items:center;margin-top:5px;font-size:13px}
.pr b{text-align:right;font-weight:650}
.kt{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--bd)}
.kp{background:var(--card);padding:10px 14px}
.kp .v{font-size:18px;margin-top:1px}
.kp .sub{font-size:11px;line-height:1.3}
@media (max-width:700px){.dash{grid-template-columns:1fr}.pg{border-right:0;border-bottom:1px solid var(--bd)}}
.fbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.fbar label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:2px}
.fbar select,.fbar input{width:auto;min-width:130px}

.bar.cb{display:flex;position:relative;height:12px}
.cb b{position:absolute;top:0;bottom:0;width:2px;background:var(--tx)}
.ctb td,.ctb th{text-align:right;white-space:nowrap}
.ctb td:first-child,.ctb th:first-child{text-align:left}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov .bx{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:18px;max-width:360px}
.ov .bx p{margin:0 0 14px}
.ov .bx>div:last-child{display:flex;gap:8px;justify-content:flex-end}
.seg{display:inline-flex;gap:4px;margin-bottom:8px}
.seg button{padding:4px 10px;font-size:13px}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--mut);font-size:10px}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:4px;flex-wrap:wrap}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.xt{width:max-content;min-width:100%;font-size:12px}
.xs{overflow:auto;max-height:75vh;-webkit-overflow-scrolling:touch}
.xt th,.xt td{padding:3px 6px;white-space:nowrap;text-align:right}
.xt th:first-child,.xt td:first-child{text-align:left;width:170px;min-width:170px;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.xt th:nth-child(-n+3),.xt td:nth-child(-n+3){position:sticky;background:var(--card);z-index:1}
.xt th:nth-child(1),.xt td:nth-child(1){left:0}
.xt th:nth-child(2),.xt td:nth-child(2){left:170px;width:84px;min-width:84px;max-width:84px}
.xt th:nth-child(3),.xt td:nth-child(3){left:254px;width:66px;min-width:66px;max-width:66px;box-shadow:2px 0 0 var(--bd)}

.xt .fr td:first-child{background:var(--bar)}
.xt .vr td:first-child{padding-left:22px;font-weight:400}
.xt .tr td{font-weight:650;border-top:2px solid var(--bd)}
.xt .m{min-width:54px;color:var(--tx)}
.xt th.now{color:var(--ac)}
.xt td.cp{background:color-mix(in srgb,var(--ok) 22%,transparent)}
.xt td.cd{background:color-mix(in srgb,var(--ac) 20%,transparent)}
@media (max-width:600px){.row{grid-template-columns:1fr}}
</style>
</head>

 r.readAsText(f)};

(async function(){
 try{
  if(!window.claude)return;
  db=await claude.use('db');

  var snap=await db.doc(DOC).get();
  if(snap.exists){state=JSON.parse(JSON.stringify(snap.data()));if(!state.prev)state.prev=SEED.prev;if(!state.computi)state.computi=[];try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}renderAll()}

 }catch(e){db=null}
